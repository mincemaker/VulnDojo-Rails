services:
  web:
    build:
      context: .
      target: development
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - sqlite_storage:/rails/storage
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: development
      RAILS_LOG_TO_STDOUT: "true"
      VULN_CHALLENGES: ${VULN_CHALLENGES:-}
      TZ: ${TZ:-Asia/Tokyo}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    stdin_open: true
    tty: true

  redis:
    image: docker.io/library/redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    volumes:
      - redis_data:/data

volumes:
  bundle_cache:
  sqlite_storage:
  redis_data:
